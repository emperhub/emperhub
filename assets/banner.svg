    <text x="95" y="73" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#BFDBFE" letter-spacing="1.5">DEVELOPER PROFILE</text>
    <text x="60" y="177" font-family="Segoe UI, Arial, sans-serif" font-size="78" font-weight="800" fill="#F8FAFC" letter-spacing="-2">emperhub</text>
    <rect x="65" y="192" width="97" height="4" rx="2" fill="url(#accent)"/>
    <text x="65" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500" fill="#CBD5E1">Roblox &amp; Luau  /  Developer Tools  /  AI Workflows</text>
    <text x="66" y="274" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#93A9CB" letter-spacing="0.5">BUILD  •  AUTOMATE  •  EXPLORE</text>
